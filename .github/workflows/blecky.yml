# Builds the Blecky Android app on every push that touches blecky/ and publishes the APK to the
# "blecky-latest" GitHub release, where the app's updater finds it.
name: Blecky APK

on:
  push:
    paths:
      - "blecky/**"
      - ".github/workflows/blecky.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blecky-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blecky
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug -PbleckyBuild=${{ github.run_number }} --console=plain

      - name: Describe the build for the in-app updater
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" blecky.apk
          python3 - <<'PY'
          import hashlib, json, os
          notes = (os.environ.get("NOTES") or "New version of Blecky.").splitlines()[0]
          notes = notes.removeprefix("Blecky: ").strip()
          json.dump({
              "versionCode": 1000 + int(os.environ["GITHUB_RUN_NUMBER"]),
              "versionName": f"8.5.{os.environ['GITHUB_RUN_NUMBER']}",
              "notes": notes[:1].upper() + notes[1:],
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/blecky-latest/blecky.apk",
              "sha256": hashlib.sha256(open("blecky.apk", "rb").read()).hexdigest(),
          }, open("update.json", "w"), indent=2)
          PY
          cat update.json

      - name: Publish to the blecky-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blecky-latest
          name: Blecky (latest build)
          body: "Built from ${{ github.sha }}. The Blecky app updates itself from here."
          make_latest: false
          files: |
            blecky/blecky.apk
            blecky/update.json
